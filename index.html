                            <select required id="f_m_plate" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-navy-800 bg-white">
                                ${filteredVehicles.map(v => `<option value="${v.plate}" ${v.plate === selPlate ? 'selected' : ''}>${v.plate} — ${v.driver}${v.model ? ' ('+v.model+')' : ''}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">วันที่ทำรายการ</label>
                            <input required type="date" id="f_m_date" value="${state.formData.date ? reverseThaiToISO(state.formData.date) : getToday()}" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-navy-800" />
                        </div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">ประเภทงานซ่อมบำรุง</label>
                            <select required id="f_m_category" class="w-full border border-navy-300 bg-navy-50 text-navy-900 font-semibold rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-navy-800">
                                ${catOptions}
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">เลขไมล์ขณะทำรายการ (กม.)</label>
                            <input required type="number" id="f_m_odometer" value="${defOdo}" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-slate-50 outline-none focus:ring-2 focus:ring-navy-800" />
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">รายละเอียดงานที่ทำ</label>
                        <textarea id="f_m_description" rows="2" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-navy-800" placeholder="เช่น เปลี่ยนถ่ายน้ำมันเครื่อง + ไส้กรอง">${state.formData.description || ''}</textarea>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">ค่าใช้จ่าย (บาท)</label>
                            <input required type="number" step="0.01" id="f_m_cost" value="${state.formData.cost !== undefined ? state.formData.cost : ''}" class="w-full border border-orange-300 bg-orange-50/50 text-orange-800 font-medium rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-orange-500" />
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">อะไหล่ที่เปลี่ยน (ถ้ามี)</label>
                            <input type="text" id="f_m_parts" value="${state.formData.partsChanged || ''}" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-navy-800" placeholder="เช่น ไส้กรองน้ำมันเครื่อง Hino" />
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">ช่าง/ศูนย์บริการ</label>
                        <input type="text" id="f_m_tech" value="${state.formData.technician || 'ศูนย์บริการ UD Trucks'}" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-navy-800" />
                    </div>
                    <div class="p-3 bg-amber-50 text-amber-800 rounded-lg text-xs border border-amber-200">
                        <i data-lucide="lightbulb" class="w-3.5 h-3.5 inline mr-1 mb-0.5"></i>
                        ระบบจะคำนวณ "รอบถัดไป" ให้อัตโนมัติจากระยะมาตรฐานของงานประเภทนี้ ไม่ต้องกรอกเอง
                    </div>
                `;
            }

            html += `
                <div class="flex space-x-3 pt-4 border-t border-slate-100 mt-2">
                    <button type="button" id="btn-cancel-form" class="flex-1 px-4 py-2 bg-white border border-slate-300 rounded-lg text-slate-700 hover:bg-slate-50 font-medium">ยกเลิก</button>
                    <button type="submit" id="btn-submit-form" class="flex-1 px-4 py-2 bg-navy-800 text-white rounded-lg hover:bg-navy-900 font-medium disabled:opacity-50">บันทึกข้อมูล</button>
                </div>
            `;
            
            form.innerHTML = html;
            modal.classList.remove('hidden');
            lucide.createIcons();

            document.getElementById('btn-cancel-form').onclick = () => modal.classList.add('hidden');
            form.onsubmit = submitData;
            
            setTimeout(() => {
                if(state.activeTab === 'refuels') calcTotalRefuel(); 
                if(state.activeTab === 'jobs' || state.activeTab === 'trips') calcFuelCost(); 
            }, 100);
        }

        document.getElementById('btn-close-modal').onclick = () => document.getElementById('main-modal').classList.add('hidden');

        document.getElementById('btn-add-new').onclick = () => {
            state.formData = {}; 
            openFormModal(false);
        };

        window.openEditModal = (id, tab) => {
            const list = state[tab];
            const item = list.find(i => i.id == id);
            if (item) {
                state.formData = { ...item };
                if (state.formData.date) state.formData.date = reverseThaiToISO(state.formData.date);
                openFormModal(true);
            }
        };

        window.applyJobSelection = () => {
            const sel = document.getElementById('job_select');
            const opt = sel.options[sel.selectedIndex];
            if(opt && opt.value) {
                document.getElementById('f_origin').value = opt.getAttribute('data-ori') || '';
                document.getElementById('f_dest').value = opt.getAttribute('data-dest') || '';
                document.getElementById('f_dist').value = opt.getAttribute('data-dist') || '';
                document.getElementById('f_revenue').value = opt.getAttribute('data-rev') || '';
                
                if(document.getElementById('f_fuelRate')) {
                    const rate = parseFloat(opt.getAttribute('data-fuelrate'));
                    document.getElementById('f_fuelRate').value = (!isNaN(rate) && rate > 0) ? rate : 2.5;
                }
                if(document.getElementById('f_currentFuelPrice')) {
                    const price = parseFloat(opt.getAttribute('data-fuelprice'));
                    document.getElementById('f_currentFuelPrice').value = (!isNaN(price) && price > 0) ? price : 36.0;
                }
                if(document.getElementById('f_driverFee')) {
                    const fee = parseFloat(opt.getAttribute('data-driverfee'));
                    document.getElementById('f_driverFee').value = !isNaN(fee) ? fee : 0;
                }

                calcFuelCost(); 
            }
        };

        window.calcFuelCost = () => {
            const distInput = document.getElementById('f_dist');
            const rateInput = document.getElementById('f_fuelRate');
            const priceInput = document.getElementById('f_currentFuelPrice');
            const costInput = document.getElementById('f_fuelCost');

            if(distInput && rateInput && priceInput && costInput) {
                const dist = parseFloat(distInput.value) || 0;
                const rate = parseFloat(rateInput.value) || 0;
                const price = parseFloat(priceInput.value) || 0;
                
                if (dist > 0 && rate > 0 && price > 0) {
                    costInput.value = (((dist * 2) / rate) * price).toFixed(2);
                } else {
                    costInput.value = 0;
                }
            }
        };

        window.calcTotalRefuel = () => {
            const liters = parseFloat(document.getElementById('f_liters')?.value);
            const price = parseFloat(document.getElementById('f_price')?.value);
            const estDiv = document.getElementById('refuel_estimate');
            if(estDiv && !isNaN(liters) && !isNaN(price)) {
                estDiv.classList.remove('hidden');
                estDiv.innerText = 'ยอดรวมประเมิน: ' + formatCurrency(liters * price);
            } else if(estDiv) {
                estDiv.classList.add('hidden');
            }
        };

        window.autoCalcDistance = async () => {
            const ori = document.getElementById('f_origin').value;
            const dest = document.getElementById('f_dest').value;
            const btn = document.getElementById('btn-calc-dist');
            if(!ori || !dest) {
                showToast('กรุณากรอกต้นทางและปลายทางก่อนครับ', 'error');
                return;
            }

            btn.innerHTML = '<i data-lucide="loader" class="w-3 h-3 mr-1 spinner"></i>กำลังคำนวณ...';
            lucide.createIcons();
            
            try {
                const geocode = async (query) => {
                    const match = query.match(/(-?[\d\.]+)\s*,\s*(-?[\d\.]+)/);
                    if (match) return { lat: match[1], lon: match[2] };
                    const res = await fetch('https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(query) + '&limit=1&countrycodes=th');
                    const data = await res.json();
                    if(data && data.length > 0) return data[0];
                    throw new Error("ไม่พบสถานที่");
                };
                const [o, d] = await Promise.all([geocode(ori), geocode(dest)]);
                const osrmRes = await fetch('https://router.project-osrm.org/route/v1/driving/' + o.lon + ',' + o.lat + ';' + d.lon + ',' + d.lat + '?overview=false');
                const osrmData = await osrmRes.json();
                
                if(osrmData.code === 'Ok') {
                    document.getElementById('f_dist').value = (osrmData.routes[0].distance / 1000).toFixed(0);
                    calcFuelCost(); 
                } else throw new Error("คำนวณไม่ได้");
            } catch (e) {
                showToast("เกิดข้อผิดพลาด: " + e.message, 'error');
            } finally {
                btn.innerHTML = '<i data-lucide="map-pin" class="w-3 h-3 mr-1"></i>คำนวณอัตโนมัติ';
                lucide.createIcons();
            }
        };

        async function submitData(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-submit-form');
            btn.disabled = true;
            const originalClasses = btn.className;
            btn.innerHTML = '<i data-lucide="loader" class="w-4 h-4 mr-2 inline spinner"></i>กำลังบันทึก...';
            lucide.createIcons();

            let newData = { 
                id: state.editMode ? state.formData.id : Date.now(),
                category: state.editMode ? (state.formData.category || state.activeCategory) : state.activeCategory 
            };
            const getVal = (id) => document.getElementById(id)?.value;
            let cascadeJobEdit = null; // ถ้าเป็นการแก้ไข "เส้นทางและเรทราคา" จะเก็บ {oldJob, newJob} ไว้ถามผู้ใช้ทีหลังว่าจะอัปเดตรายการวิ่งงานเดิมด้วยไหม

            if (state.activeTab === 'trips' || state.activeTab === 'refuels') {
                newData.date = formatToThaiShort(getVal('f_date'));
                
                let rawPlate = getVal('f_plate') || '';
                if (rawPlate.includes(' (')) {
                    rawPlate = rawPlate.split(' (')[0].trim();
                }
                newData.plate = rawPlate;
            }

            let actionType = '';
            if (state.activeTab === 'trips') {
                actionType = state.editMode ? 'editTrip' : 'addTrip';
                Object.assign(newData, {
                    origin: getVal('f_origin'), dest: getVal('f_dest'),
                    dist: Number(getVal('f_dist')), 
                    fuelRate: Number(getVal('f_fuelRate') || 0), 
                    currentFuelPrice: Number(getVal('f_currentFuelPrice') || 0), 
                    fuelCost: Number(getVal('f_fuelCost') || 0),
                    driverFee: Number(getVal('f_driverFee') || 0), 
                    revenue: Number(getVal('f_revenue')),
                    weight: state.activeCategory === 'semidump' ? Number(getVal('f_weight') || 0) : 0
                });
                newData.profit = newData.revenue - newData.fuelCost - newData.driverFee;
                if(state.editMode) state.trips = state.trips.map(t => t.id === newData.id ? newData : t);
                else state.trips.unshift(newData);
            } else if (state.activeTab === 'refuels') {
                actionType = state.editMode ? 'editRefuel' : 'addRefuel';
                Object.assign(newData, { liters: Number(getVal('f_liters')), price: Number(getVal('f_price')) });
                newData.total = newData.liters * newData.price;
                if(state.editMode) state.refuels = state.refuels.map(r => r.id === newData.id ? newData : r);
                else state.refuels.unshift(newData);
            } else if (state.activeTab === 'vehicles') {
                actionType = state.editMode ? 'editVehicle' : 'addVehicle';
                Object.assign(newData, { 
                    plate: getVal('f_plate'), driver: getVal('f_driver'), type: getVal('f_type'),
                    model: getVal('f_model') || '', year: getVal('f_year') || '',
                    baselineOdometer: Number(getVal('f_baselineOdometer') || 0),
                    baselineDate: formatToThaiShort(getVal('f_baselineDate') || getToday())
                });
                if(state.editMode) state.vehicles = state.vehicles.map(v => v.id === newData.id ? newData : v);
                else state.vehicles.unshift(newData);
            } else if (state.activeTab === 'jobs') {
                actionType = state.editMode ? 'editJob' : 'addJob';
                Object.assign(newData, { 
                    origin: getVal('f_origin'), dest: getVal('f_dest'), 
                    dist: Number(getVal('f_dist')), revenue: Number(getVal('f_revenue')),
                    fuelRate: Number(getVal('f_fuelRate') || 0), 
                    currentFuelPrice: Number(getVal('f_currentFuelPrice') || 0), 
                    fuelCost: Number(getVal('f_fuelCost') || 0),
                    driverFee: Number(getVal('f_driverFee') || 0) 
                });
                if(state.editMode) {
                    const oldJob = state.jobs.find(j => j.id === newData.id);
                    if (oldJob) cascadeJobEdit = { oldJob: { ...oldJob }, newJob: newData };
                    state.jobs = state.jobs.map(j => j.id === newData.id ? newData : j);
                }
                else state.jobs.unshift(newData);
            } else if (state.activeTab === 'maintenance') {
                actionType = state.editMode ? 'editMaintenance' : 'addMaintenance';
                Object.assign(newData, {
                    plate: getVal('f_m_plate'),
                    date: formatToThaiShort(getVal('f_m_date')),
                    category: getVal('f_m_category'),
                    odometer: Number(getVal('f_m_odometer') || 0),
                    description: getVal('f_m_description') || '',
                    cost: Number(getVal('f_m_cost') || 0),
                    partsChanged: getVal('f_m_parts') || '',
                    technician: getVal('f_m_tech') || 'ศูนย์บริการ UD Trucks'
                });
                if(state.editMode) state.maintenanceLogs = state.maintenanceLogs.map(m => m.id === newData.id ? newData : m);
                else state.maintenanceLogs.unshift(newData);
            }

            let saveOk = true;
            if(GAS_WEB_APP_URL && !GAS_WEB_APP_URL.includes("ใส่_URL")) {
                saveOk = await sendGasAction(actionType, newData);
            }

            // เพิ่มลูกเล่น: หน่วงเวลาและเปลี่ยนปุ่มเป็นสีเขียวแจ้งว่าสำเร็จก่อนปิด (เฉพาะตอนบันทึกได้จริง)
            if (saveOk) {
                btn.innerHTML = '<i data-lucide="check-circle" class="w-5 h-5 mr-2 inline"></i>บันทึกสำเร็จ';
                btn.classList.remove('bg-navy-800', 'hover:bg-navy-900');
                btn.classList.add('bg-green-600', 'hover:bg-green-700');
                lucide.createIcons();
            }

            setTimeout(() => {
                document.getElementById('main-modal').classList.add('hidden');
                renderNav();
                renderContent();
                
                // คืนค่าปุ่มกลับเป็นเหมือนเดิมสำหรับรอบหน้า
                btn.disabled = false;
                btn.className = originalClasses;
                btn.innerText = 'บันทึกข้อมูล';
                
                if (saveOk) showToast('บันทึกข้อมูลสำเร็จ!', 'success');
                if (saveOk && cascadeJobEdit) promptCascadeJobUpdate(cascadeJobEdit.oldJob, cascadeJobEdit.newJob);
            }, saveOk ? 800 : 0); // หน่วงเวลา 0.8 วินาทีให้ผู้ใช้มองทันตอนสำเร็จ — ถ้าไม่สำเร็จปิดทันที (error toast จาก sendGasAction แสดงอยู่แล้ว)
        }

        // ==========================================================
        // 🔄 อัปเดตรายการวิ่งงานเดิมตามเรทเส้นทางที่เพิ่งแก้ไข (ถ้าผู้ใช้ยืนยัน)
        // ==========================================================
        // จับคู่รายการวิ่งงานเดิมกับเส้นทางด้วยต้นทาง+ปลายทาง+หมวดหมู่ (ระบบไม่ได้ผูก ID
        // เส้นทางไว้กับรายการวิ่งงานที่กรอกไปแล้ว จึงจับคู่แบบอิงข้อความเป็นค่าประมาณที่ดีที่สุด)
        function promptCascadeJobUpdate(oldJob, newJob) {
            if (!oldJob) return;
            const category = newJob.category || 'flatbed';
            const matches = state.trips.filter(t =>
                (t.category || 'flatbed') === category &&
                t.origin === oldJob.origin &&
                t.dest === oldJob.dest
            );
            if (matches.length === 0) return;

            customConfirm(
                `พบรายการวิ่งงานเดิมที่ใช้เส้นทาง "${oldJob.origin} → ${oldJob.dest}" อยู่ <b class="text-slate-700">${matches.length} รายการ</b><br>ต้องการอัปเดตระยะทาง/ยอดรับ/ค่าน้ำมัน/ค่าคนขับของรายการเหล่านี้ให้ตรงกับเรทที่เพิ่งแก้ไขด้วยหรือไม่?<br><span class="text-xs text-slate-400">(วันที่ ทะเบียนรถ และน้ำหนักของแต่ละเที่ยวจะไม่เปลี่ยน)</span>`,
                async () => {
                    document.getElementById('loading-spinner').classList.remove('hidden');
                    matches.forEach(t => {
                        t.origin = newJob.origin;
                        t.dest = newJob.dest;
                        t.dist = newJob.dist;
                        t.fuelRate = newJob.fuelRate;
                        t.currentFuelPrice = newJob.currentFuelPrice;
                        t.fuelCost = newJob.fuelCost;
                        t.driverFee = newJob.driverFee;
                        t.revenue = newJob.revenue;
                        t.profit = Number(newJob.revenue || 0) - Number(newJob.fuelCost || 0) - Number(newJob.driverFee || 0);
                    });
                    for (const t of matches) {
                        await sendGasAction('editTrip', t);
                    }
                    document.getElementById('loading-spinner').classList.add('hidden');
                    renderNav();
                    renderContent();
                    showToast(`อัปเดตรายการวิ่งงานที่เกี่ยวข้อง ${matches.length} รายการเรียบร้อย!`, 'success');
                },
                {
                    title: 'อัปเดตรายการวิ่งงานเดิมด้วยหรือไม่?',
                    icon: 'refresh-cw',
                    iconWrapClass: 'bg-amber-100 text-amber-700',
                    confirmLabel: `อัปเดตทั้ง ${matches.length} รายการ`,
                    confirmLoadingLabel: 'กำลังอัปเดต...',
                    confirmBtnClass: 'bg-amber-600 hover:bg-amber-700'
                }
            );
        }

        // Custom Confirm Modal Logic
        window.customConfirm = (message, onConfirm, opts) => {
            opts = opts || {};
            const title = opts.title || 'ยืนยันการลบข้อมูล';
            const confirmLabel = opts.confirmLabel || 'ลบข้อมูล';
            const confirmLoadingLabel = opts.confirmLoadingLabel || 'รอสักครู่...';
            const icon = opts.icon || 'alert-triangle';
            const iconWrapClass = opts.iconWrapClass || 'bg-navy-100 text-navy-800';
            const confirmBtnClass = opts.confirmBtnClass || 'bg-navy-700 hover:bg-navy-800';

            const overlay = document.createElement('div');
            overlay.className = "fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[9999] flex items-center justify-center p-4";
            overlay.innerHTML = `
                <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-sm text-center">
                    <div class="w-12 h-12 ${iconWrapClass} rounded-full flex items-center justify-center mx-auto mb-4">
                        <i data-lucide="${icon}" class="w-6 h-6"></i>
                    </div>
                    <h3 class="text-lg font-bold text-slate-800 mb-2">${title}</h3>
                    <p class="text-slate-500 mb-6 text-sm">${message}</p>
                    <div class="flex space-x-3">
                        <button id="cancel-btn" class="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-lg transition-colors">ยกเลิก</button>
                        <button id="confirm-btn" class="flex-1 py-2.5 ${confirmBtnClass} text-white font-medium rounded-lg transition-colors shadow-sm">${confirmLabel}</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
            lucide.createIcons();

            document.getElementById('cancel-btn').onclick = () => { overlay.remove(); if (opts.onCancel) opts.onCancel(); };
            document.getElementById('confirm-btn').onclick = function() {
                const btn = this;
                btn.innerHTML = `<i data-lucide="loader" class="w-4 h-4 mr-2 inline spinner"></i>${confirmLoadingLabel}`;
                lucide.createIcons();
                
                // หน่วงเวลาเล็กน้อยให้ดูเนียนตา
                setTimeout(() => {
                    overlay.remove();
                    onConfirm();
                }, 600);
            };
        };

        // Toast Notification System
        window.showToast = (message, type = "success") => {
            const toast = document.createElement('div');
            const isError = type === "error";
            toast.className = `fixed top-6 right-6 px-6 py-3 rounded-xl shadow-lg border flex items-center space-x-3 transition-all transform translate-x-full z-[10000] font-medium ${isError ? 'bg-red-50 border-red-200 text-red-700' : 'bg-green-50 border-green-200 text-green-700'}`;
            
            toast.innerHTML = `
                <i data-lucide="${isError ? 'alert-circle' : 'check-circle'}" class="w-5 h-5"></i>
                <span>${message}</span>
            `;
            
            document.body.appendChild(toast);
            lucide.createIcons();
            
            // Animate in
            setTimeout(() => {
                toast.classList.remove('translate-x-full');
            }, 10);

            // Animate out and remove
            setTimeout(() => {
                toast.classList.add('translate-x-full');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        window.deleteData = (id, actionStr, sheetType) => {
            customConfirm("คุณแน่ใจหรือไม่ว่าต้องการลบข้อมูลรายการนี้? (ลบแล้วกู้คืนไม่ได้)", async () => {
                document.getElementById('loading-spinner').classList.remove('hidden');
                try {
                    const res = await fetch(GAS_WEB_APP_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: actionStr, id: id, sheetType: sheetType })
                    });
                    const result = await res.json();
                    if (result.status !== 'success') {
                        throw new Error(result.message || 'เซิร์ฟเวอร์ปฏิเสธการลบ');
                    }

                    if (actionStr.includes('Trip')) state.trips = state.trips.filter(i => i.id != id);
                    else if (actionStr.includes('Refuel')) state.refuels = state.refuels.filter(i => i.id != id);
                    else if (actionStr.includes('Vehicle')) state.vehicles = state.vehicles.filter(i => i.id != id);
                    else if (actionStr.includes('Job')) state.jobs = state.jobs.filter(i => i.id != id);
                    else if (actionStr.includes('Maintenance')) state.maintenanceLogs = state.maintenanceLogs.filter(i => i.id != id);
                    else if (actionStr.includes('Tire')) state.tires = state.tires.filter(i => i.id != id);

                    renderNav();
                    renderContent();
                    showToast("ลบข้อมูลสำเร็จ!");
                } catch (e) {
                    console.error(e);
                    showToast("เกิดข้อผิดพลาดในการลบข้อมูล", "error");
                } finally {
                    document.getElementById('loading-spinner').classList.add('hidden');
                }
            });
        };

        window.openMapModal = () => {
            const mapHtml = `
                <!DOCTYPE html><html lang="th"><head><meta charset="utf-8">
                <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
                <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"><\/script>
                <style>body, html, #map { height: 100%; margin: 0; padding: 0; font-family: sans-serif; } .search-panel { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); z-index: 1000; background: rgba(255, 255, 255, 0.95); padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); width: 90%; max-width: 400px; display: flex; flex-direction: column; gap: 10px; } input, button { padding: 8px 12px; border-radius: 8px; border: 1px solid #cbd5e1; outline:none; } button { background: #1e3350; color: white; border: none; cursor: pointer; font-weight: bold; } #status { font-size: 12px; text-align: center; }</style>
                </head><body>
                <div class="search-panel"><label style="font-size:12px;font-weight:bold;color:#475569;">📍 ต้นทาง</label><input type="text" id="ori" placeholder="เช่น สระบุรี หรือ 13.7,100.5"><label style="font-size:12px;font-weight:bold;color:#475569;">🎯 ปลายทาง</label><input type="text" id="dest" placeholder="เช่น ระยอง"><button id="calcBtn">ค้นหาและคำนวณระยะทาง</button><div id="status"></div></div><div id="map"></div>
                <script>
                const map = L.map("map").setView([13.75, 100.5], 6);
                L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);
                let routeLayer = null, markers = [];
                async function geocode(q) {
                    const m = q.match(/([\\d\\.]+)\\s*,\\s*([\\d\\.]+)/);
                    if (m) return { lat: parseFloat(m[1]), lon: parseFloat(m[2]) };
                    const r = await fetch("https://nominatim.openstreetmap.org/search?format=json&q=" + encodeURIComponent(q) + "&limit=1&countrycodes=th");
                    const d = await r.json();
                    if (d && d.length > 0) return d[0];
                    throw new Error("ไม่พบสถานที่");
                }
                document.getElementById("calcBtn").onclick = async function() {
                    const ori = document.getElementById("ori").value;
                    const dest = document.getElementById("dest").value;
                    const statusEl = document.getElementById("status");
                    if(!ori || !dest) return statusEl.innerText = "กรุณากรอกข้อมูลให้ครบ", statusEl.style.color="red";
                    statusEl.innerText = "กำลังค้นหา..."; statusEl.style.color="#1e3350"; this.disabled = true;
                    try {
                        const [o, d] = await Promise.all([geocode(ori), geocode(dest)]);
                        if(markers.length) { markers.forEach(m=>map.removeLayer(m)); markers=[]; }
                        if(routeLayer) map.removeLayer(routeLayer);
                        markers.push(L.marker([o.lat, o.lon]).addTo(map).bindPopup("ต้นทาง").openPopup());
                        markers.push(L.marker([d.lat, d.lon]).addTo(map).bindPopup("ปลายทาง"));
                        statusEl.innerText = "กำลังดึงเส้นทาง...";
                        const res = await fetch("https://router.project-osrm.org/route/v1/driving/" + o.lon + "," + o.lat + ";" + d.lon + "," + d.lat + "?overview=full&geometries=geojson");
                        const data = await res.json();
                        if(data.code === "Ok") {
                            const dist = (data.routes[0].distance / 1000).toFixed(0);
                            routeLayer = L.geoJSON(data.routes[0].geometry, {style: {color: "#1e3350", weight: 5}}).addTo(map);
                            map.fitBounds(routeLayer.getBounds(), {padding:[50,50]});
                            statusEl.innerText = "ระยะทาง: " + dist + " กม. (กำลังส่งข้อมูลกลับ)";
                            statusEl.style.color = "green";
                            setTimeout(() => { window.parent.postMessage({ type: "MAP_SELECTED", dist: dist, origin: ori, dest: dest }, "*"); }, 1500);
                        } else throw new Error("ไม่พบเส้นทาง");
                    } catch(e) { statusEl.innerText = e.message; statusEl.style.color="red"; }
                    this.disabled = false;
                };
                <\/script></body></html>
            `;
            document.getElementById('map-iframe').srcdoc = mapHtml;
            document.getElementById('map-modal').classList.remove('hidden');
        };

        const closeMapModal = () => document.getElementById('map-modal').classList.add('hidden');
        document.getElementById('btn-close-map').onclick = closeMapModal;
        document.getElementById('btn-close-map-bottom').onclick = closeMapModal;

        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'MAP_SELECTED') {
                document.getElementById('f_dist').value = event.data.dist;
                document.getElementById('f_origin').value = event.data.origin;
                document.getElementById('f_dest').value = event.data.dest;
                calcFuelCost();
                closeMapModal();
                
                // ลูกเล่น: ทำให้ช่องที่ถูกดึงข้อมูลมาจากแผนที่เรืองแสงสีเขียวแปปนึงเพื่อให้รู้ว่าข้อมูลมาแล้ว
                ['f_dist', 'f_origin', 'f_dest', 'f_fuelCost'].forEach(id => {
                    const el = document.getElementById(id);
                    if(el) {
                        el.style.transition = 'all 0.5s ease';
                        el.classList.add('ring-2', 'ring-green-500', 'bg-green-50');
                        setTimeout(() => el.classList.remove('ring-2', 'ring-green-500', 'bg-green-50'), 1500);
                    }
                });
            }
        });

        // ==========================================================
        // 🧹 ปรับชนิดข้อมูลให้เป็น "ข้อความ" เสมอหลังโหลดจากฐานข้อมูล
        // ==========================================================
        // ถ้ามีใครพิมพ์ทะเบียนรถที่เป็นตัวเลขล้วน (เช่น 729674) ตรงๆ ลงใน Google Sheet
        // โดยไม่ผ่านฟอร์มของเว็บ, Sheets จะเก็บเป็นชนิด "ตัวเลข" ไม่ใช่ "ข้อความ"
        // ทำให้การเทียบทะเบียนรถ (v.plate === state.activeVehiclePlate) ไม่ตรงกัน
        // และกดเลือกรถคันนั้นไม่ติด — ฟังก์ชันนี้แปลงให้เป็นข้อความเหมือนกันหมดทุกจุดที่โหลดเข้ามา
        function normalizeLoadedData() {
            const cleanPlate = (v) => (v === undefined || v === null) ? '' : String(v).trim();
            state.vehicles.forEach(v => { v.plate = cleanPlate(v.plate); v.category = v.category || 'flatbed'; });
            state.trips.forEach(t => { t.plate = cleanPlate(t.plate); });
            state.refuels.forEach(r => { r.plate = cleanPlate(r.plate); });
            state.maintenanceLogs.forEach(m => { m.plate = cleanPlate(m.plate); });
            state.tires.forEach(t => { t.plate = cleanPlate(t.plate); t.position = Number(t.position); });
        }

        async function initApp() {
            renderNav();
            if(!GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes("ใส่_URL")) {
                seedDemoDataIfEmpty();
                renderNav();
                renderContent();
                return;
            }

            try {
                document.getElementById('loading-spinner').classList.remove('hidden');
                const res = await fetch(GAS_WEB_APP_URL + "?t=" + new Date().getTime());
                const data = await res.json();
                if(data.status === 'success') {
                    state.trips = data.trips || [];
                    state.refuels = data.refuels || [];
                    state.vehicles = data.vehicles || [];
                    state.jobs = data.jobs || [];
                    state.maintenanceLogs = data.maintenance || data.maintenanceLogs || [];
                    state.tires = data.tires || [];
                    normalizeLoadedData();
                }
            } catch (e) { console.error("Load error", e); }
            finally {
                seedDemoDataIfEmpty();
                renderNav();
                renderContent();
                document.getElementById('loading-spinner').classList.add('hidden');
            }
        }

        // ==========================================================
        // 🧪 ข้อมูลตัวอย่าง (Demo) — แสดงเฉพาะตอนที่ยังไม่มีข้อมูลรถในระบบ
        // เพื่อสาธิตระบบซ่อมบำรุง/ยางรถ ก่อนที่จะเชื่อมฐานข้อมูลจริง (Google Sheets)
        // ==========================================================
        function seedDemoDataIfEmpty() {
            if (state.vehicles.length > 0) return;
            state.isDemoData = true;

            state.vehicles = [
                { id: 9001, plate: '88-2059', driver: '(ระบุชื่อคนขับ)', type: 'รถหัวลาก', category: 'flatbed', model: 'UD370', year: '2559', baselineOdometer: 385000, baselineDate: '1/6/2569' },
                { id: 9002, plate: '72-8671', driver: '(ระบุชื่อคนขับ)', type: 'รถหัวลาก', category: 'flatbed', model: 'UD370', year: '2559', baselineOdometer: 410000, baselineDate: '1/6/2569' },
                { id: 9003, plate: '72-6512', driver: '(ระบุชื่อคนขับ)', type: 'รถหัวลาก', category: 'semidump', model: 'UD330', year: '2561', baselineOdometer: 268000, baselineDate: '1/6/2569' },
                { id: 9004, plate: '72-9674', driver: '(ระบุชื่อคนขับ)', type: 'รถหัวลาก', category: 'semidump', model: 'UD330', year: '2561', baselineOdometer: 252000, baselineDate: '1/6/2569' }
            ];

            state.maintenanceLogs = [
                { id: 8001, plate: '88-2059', date: '2/4/2569', category: 'oil_engine', odometer: 376200, description: 'เปลี่ยนถ่ายน้ำมันเครื่อง + ไส้กรอง', cost: 4200, partsChanged: 'น้ำมันเครื่อง 15W-40, ไส้กรองน้ำมันเครื่อง', technician: 'ศูนย์บริการ UD Trucks' },
                { id: 8002, plate: '88-2059', date: '20/1/2569', category: 'brake_check', odometer: 340500, description: 'เปลี่ยนผ้าเบรกล้อหลังคู่หน้า', cost: 6800, partsChanged: 'ผ้าเบรกแท้ UD', technician: 'ศูนย์บริการ UD Trucks' },
                { id: 8003, plate: '72-8671', date: '15/3/2569', category: 'oil_engine', odometer: 401800, description: 'เปลี่ยนถ่ายน้ำมันเครื่อง', cost: 4200, partsChanged: 'น้ำมันเครื่อง 15W-40', technician: 'ศูนย์บริการ UD Trucks' },
                { id: 8004, plate: '72-6512', date: '10/2/2569', category: 'oil_engine', odometer: 260500, description: 'เปลี่ยนถ่ายน้ำมันเครื่อง + ไส้กรอง', cost: 3900, partsChanged: 'น้ำมันเครื่อง, ไส้กรอง', technician: 'ศูนย์บริการ UD Trucks' },
                { id: 8005, plate: '72-6512', date: '5/12/2568', category: 'diff_oil', odometer: 245000, description: 'เปลี่ยนน้ำมันเฟืองท้าย', cost: 2600, partsChanged: 'น้ำมันเฟืองท้าย 85W-140', technician: 'ศูนย์บริการ UD Trucks' }
            ];

            // สร้างข้อมูลยางตัวอย่างให้รถทะเบียน 88-2059 บางส่วน เพื่อสาธิตผังยาง 22 ตำแหน่ง
            const demoTireSeed = [
                { plate: '88-2059', position: 1, brand: 'Bridgestone R150', serial: '2224X1', installDate: '1/6/2568', installOdometer: 330000 },
                { plate: '88-2059', position: 2, brand: 'Bridgestone R150', serial: '2224X2', installDate: '1/6/2568', installOdometer: 330000 },
                { plate: '88-2059', position: 3, brand: 'Deestone D922', serial: '1123A3', installDate: '10/1/2569', installOdometer: 355000 },
                { plate: '88-2059', position: 4, brand: 'Deestone D922', serial: '1123A4', installDate: '10/1/2569', installOdometer: 355000 }
            ];
            state.tires = demoTireSeed.map((t, i) => ({ id: 7001 + i, status: 'active', notes: '', ...t }));
        }

        // เริ่มต้นการทำงาน: แสดงหน้า PIN Login เป็นอันดับแรก
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            showPinModal('login');
        });
    </script>
</body>
