    <style>

<body class="bg-slate-50 text-slate-800 flex h-screen overflow-hidden relative">
    <div id="pinOverlay" class="fixed inset-0 bg-slate-900/95 z-[9999] flex items-center justify-center p-4 backdrop-blur-md hidden">

            <div class="mb-6">
                <input type="password" id="pinInput" inputmode="numeric" pattern="[0-9]*" maxlength="4"

                       placeholder="กรอกรหัส 4 หลัก" oninput="handlePinInput(this.value)">
            </div>
            <button id="pinCancelBtn" onclick="cancelActionPin()" class="hidden w-full py-3 bg-slate-100 hover:bg-slate-200 rounded-xl font-bold text-slate-600 transition-colors mt-2">
                ยกเลิก

        </div>

    <!-- ฉากหลังมืดตอนเปิดเมนูบนมือถือ/แท็บเล็ต -->

    <aside id="sidebar" class="w-72 max-w-[85vw] bg-white border-r border-slate-200 flex flex-col shadow-sm flex-shrink-0 z-40 fixed inset-y-0 left-0 -translate-x-full transition-transform duration-300 ease-in-out lg:relative lg:translate-x-0 lg:transition-none">
        <div class="p-6 border-b border-slate-100 flex items-center justify-between flex-shrink-0">

            <button onclick="closeMobileNav()" class="lg:hidden text-slate-400 hover:text-slate-600 p-1">

    <main class="flex-1 flex flex-col min-w-0 h-screen">
        <header class="bg-white border-b border-slate-200 px-4 md:px-8 py-4 md:py-5 flex justify-between items-center z-10 flex-shrink-0 shadow-sm gap-3">

                <h2 class="text-lg md:text-2xl font-bold text-slate-800 flex items-center min-w-0 truncate">

    <!-- Main Modal (เพิ่ม/แก้ไข ข้อมูล) -->

    <!-- Map Modal -->
    <div id="map-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[70] flex items-center justify-center p-4">

    <!-- Tire Detail Modal -->
    <div id="tire-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[75] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h3 id="tire-modal-title" class="text-base font-bold text-slate-800">รายละเอียดยาง</h3>
                <button onclick="closeTireModal()" class="text-slate-400 hover:text-slate-600 transition-colors">
                    <i data-lucide="x" class="h-5 w-5"></i>
                </button>
            </div>
            <div id="tire-modal-body" class="p-6 max-h-[75vh] overflow-y-auto"></div>
        </div>
    </div>

    <script>
        // 👇👇👇 URL ของ Google Apps Script 👇👇👇
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxU1NX1AJ7BGqr0DHPK60RKGAaQlW5iJbFsKYJusTTI7rUC5grgVRwY_TM4au7LtUuVSg/exec";

        // ==========================================
        // 🔒 รหัสผ่าน (PIN)
        // ==========================================
        const LOGIN_PIN = "8899";
        const ACTION_PIN = "2233";
        // ==========================================

        let state = {
            activeCategory: 'flatbed', 
            activeTab: 'overview',
            filterYear: null,
            filterMonth: null,
            filterPeriod: null,
            // ปิดโฟลเดอร์เดือนไว้ เปิดเฉพาะโฟลเดอร์ปี
            expandedTree: { 
                'flatbed_y2569': true, 
                'semidump_y2569': true 
            },
            trips: [],
            refuels: [],
            vehicles: [],
            jobs: [],
            maintenanceLogs: [],
            tires: [],
            editMode: false,
            formData: {},
            charts: {},
            jobSortMode: 'recent', // 'recent' or 'alpha'
            activeVehiclePlate: null, // ทะเบียนที่เลือกดูในหน้าซ่อมบำรุง/ยาง
            isDemoData: false
        };

        const monthNames = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
        const formatCurrency = (num) => new Intl.NumberFormat('th-TH', { style: 'currency', currency: 'THB', minimumFractionDigits: 0 }).format(num || 0);
        const formatNumber = (num) => new Intl.NumberFormat('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(num || 0);
        
        const getToday = () => {
            const tzoffset = (new Date()).getTimezoneOffset() * 60000;
            return (new Date(Date.now() - tzoffset)).toISOString().split('T')[0];
        };

        const formatToThaiShort = (isoDate) => {
            if(!isoDate) return '';
            const parts = isoDate.split('-');
            if(parts.length !== 3) return isoDate;
            let y = parseInt(parts[0], 10);
            if (y < 2500) y += 543;
            return parseInt(parts[2], 10) + '/' + parseInt(parts[1], 10) + '/' + y;
        };

        const formatDisplayDate = (rawDate) => {
            if (!rawDate) return '-';
            const strDate = String(rawDate);
            if (strDate.includes('T')) {
                const d = new Date(strDate);
                if (!isNaN(d.getTime())) {
                    let y = d.getFullYear();
                    if (y >= 1900 && y < 2000) y = 2500 + (y % 100);
                    else if (y >= 2000 && y < 2500) y += 543;
                    return d.getDate() + '/' + (d.getMonth() + 1) + '/' + y;
                }
            }
            return strDate;
        };

        const reverseThaiToISO = (thaiDate) => {
            if(!thaiDate) return getToday();
            const strDate = String(thaiDate);
            if(strDate.includes('T')) {
                const d = new Date(strDate);
                if(!isNaN(d.getTime())) {
                    let y = d.getFullYear();
                    if (y >= 1900 && y < 2000) y = 2000 + (y % 100) - 43; 
                    else if (y > 2500) y -= 543;
                    return y + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
                }
            }
            const parts = strDate.split('/');
            if(parts.length !== 3) return getToday();
            let y = parseInt(parts[2], 10);
            if(y > 2500) y -= 543;
            else if(y < 100) y = 2000 + y;
            const m = parts[1].padStart(2, '0');
            const d = parts[0].padStart(2, '0');
            return y + '-' + m + '-' + d;
        };

        const parseDateForSort = (dStr) => {
            if (!dStr) return 0;
            const str = String(dStr);
            if (str.includes('-')) {
                const d = new Date(str);
                if (!isNaN(d.getTime())) return d.getTime();
            }
            const parts = str.split('/');
            if (parts.length === 3) {
                let d = parseInt(parts[0], 10);
                let m = parseInt(parts[1], 10) - 1;
                let y = parseInt(parts[2], 10);
                if (y > 2500) y -= 543;
                return new Date(y, m, d).getTime();
            }
            return 0;
        };

        window.pendingActionFunc = null;

        window.showPinModal = (type) => {
            const overlay = document.getElementById('pinOverlay');
            const input = document.getElementById('pinInput');
            const title = document.getElementById('pinTitle');
            const subtitle = document.getElementById('pinSubtitle');
            const cancelBtn = document.getElementById('pinCancelBtn');

            input.value = "";
            overlay.dataset.pinType = type;

            if (type === 'login') {
                title.innerText = "กรุณากรอกรหัส PIN";
                subtitle.innerText = "ระบุรหัส 4 หลักเพื่อเข้าใช้งานระบบ";
                cancelBtn.classList.add('hidden');
            } else {
                title.innerText = "ยืนยันตัวตน";
                subtitle.innerText = "กรุณากรอกรหัส PIN เพื่อแก้ไขหรือลบข้อมูล";
                cancelBtn.classList.remove('hidden');
            }

            overlay.classList.remove('hidden');
            setTimeout(() => input.focus(), 100);
        };

        window.handlePinInput = (val) => {
            const cleanVal = val.replace(/\D/g, '');
            const input = document.getElementById('pinInput');
            input.value = cleanVal;

            if (cleanVal.length === 4) {
                const type = document.getElementById('pinOverlay').dataset.pinType;
                const expected = (type === 'login') ? LOGIN_PIN : ACTION_PIN;

                setTimeout(() => {
                    if (cleanVal === expected) {
                        document.getElementById('pinOverlay').classList.add('hidden');
                        if (type === 'login') {
                            initApp(); 
                        } else if (window.pendingActionFunc) {
                            window.pendingActionFunc();
                            window.pendingActionFunc = null;
                        }
                    } else {
                        // Toast notification for wrong PIN
                        showToast("รหัส PIN ไม่ถูกต้อง!", "error");
                        input.value = "";
                        input.focus();
                    }
                }, 150);
            }
        };

        window.cancelActionPin = () => {
            document.getElementById('pinOverlay').classList.add('hidden');
            window.pendingActionFunc = null;
            document.getElementById('pinInput').value = "";
        };

        window.requestActionPin = (funcString) => {
            window.pendingActionFunc = new Function(funcString);
            showPinModal('action');
        };

        // ==========================================================
        // 📱 เมนูด้านข้างแบบเปิด-ปิดได้บนมือถือ/แท็บเล็ต (off-canvas drawer)
        // ==========================================================
        window.openMobileNav = () => {
            document.getElementById('sidebar').classList.remove('-translate-x-full');
            document.getElementById('sidebar-backdrop').classList.remove('hidden');
        };
        window.closeMobileNav = () => {
            document.getElementById('sidebar').classList.add('-translate-x-full');
            document.getElementById('sidebar-backdrop').classList.add('hidden');
        };
        // ปิดเมนูอัตโนมัติเฉพาะตอนหน้าจอเล็กกว่า desktop (md breakpoint = 768px)
        function closeMobileNavIfSmallScreen() {
            if (window.innerWidth < 1024) closeMobileNav();
        }

        window.toggleTree = (key) => {
            const isMonth = key.match(/m\d+$/);
            
            if (isMonth) {
                // ถ้าคลิกเดือน ให้ปิดเดือนอื่นให้หมดก่อนเปิด
                if (!state.expandedTree[key]) {
                    Object.keys(state.expandedTree).forEach(k => {
                        if (k.match(/m\d+$/)) {
                            state.expandedTree[k] = false;
                        }
                    });
                    state.expandedTree[key] = true;
                } else {
                    state.expandedTree[key] = false;
                }
            } else {
                state.expandedTree[key] = !state.expandedTree[key];
            }
            
            renderNav();
        };

        window.changeTab = (category, tabId) => {
            state.activeCategory = category;
            state.activeTab = tabId;
            state.filterYear = null;
            state.filterMonth = null;
            state.filterPeriod = null;
            renderNav();
            renderContent();
            closeMobileNavIfSmallScreen();
        };

        window.changeTabPeriod = (category, tabId, year, month, period) => {
            state.activeCategory = category;
            state.activeTab = tabId;
            state.filterYear = year;
            state.filterMonth = month;
            state.filterPeriod = period;
            renderNav();
            renderContent();
            closeMobileNavIfSmallScreen();
        };

        const categories = [
            { id: 'flatbed', label: 'รถพื้นเรียบ', icon: 'truck' },
            { id: 'semidump', label: 'รถเซมิดั๊ม', icon: 'combine' }
        ];

        // ==========================================================
        // 🔧 ระบบซ่อมบำรุงรักษา (Maintenance) — ฐานความรู้ช่างศูนย์ UD
        // ==========================================================
        // หมายเหตุ: ระยะที่กำหนดเป็น "แนวทางทั่วไป" สำหรับรถบรรทุกดีเซลงานหนัก
        // ควรตรวจสอบระยะจริงกับคู่มือประจำรถ/ศูนย์บริการ UD Trucks อีกครั้ง
        const TECH_NAME = "ช่างเอก";
        const TECH_TITLE = "ทีมช่างศูนย์บริการ UD Trucks";

        const MAINTENANCE_TYPES = [
            { key: 'oil_engine', label: 'เปลี่ยนถ่ายน้ำมันเครื่อง', icon: 'droplets', km: 10000, months: 6,
              tip: 'ใช้น้ำมันเครื่องดีเซลเกรดที่ศูนย์ UD แนะนำ (ตามสภาพงาน/บรรทุกหนักอาจร่นระยะเหลือ 8,000 กม.)' },
            { key: 'oil_filter', label: 'เปลี่ยนไส้กรองน้ำมันเครื่อง', icon: 'filter', km: 10000, months: 6,
              tip: 'เปลี่ยนพร้อมน้ำมันเครื่องทุกครั้งเพื่อป้องกันตะกอนหมุนเวียนกลับเข้าเครื่อง' },
            { key: 'fuel_filter', label: 'เปลี่ยนกรองโซล่า/ดักน้ำ', icon: 'filter', km: 20000, months: 6,
              tip: 'ถ่ายน้ำที่กรองดักน้ำทุกสัปดาห์ โดยเฉพาะช่วงหน้าฝนหรือเติมน้ำมันจากปั๊มที่ไม่มั่นใจคุณภาพ' },
            { key: 'air_filter', label: 'ตรวจ/เปลี่ยนกรองอากาศ', icon: 'wind', km: 20000, months: 12,
              tip: 'เคาะฝุ่นทุก 10,000 กม. หากวิ่งงานเส้นทางฝุ่นมาก/เหมืองหิน ให้ร่นระยะตรวจถี่ขึ้น' },
            { key: 'brake_check', label: 'ตรวจ/เปลี่ยนผ้าเบรก', icon: 'disc', km: 40000, months: 12,
              tip: 'รถบรรทุกน้ำหนักมากผ้าเบรกสึกไว ควรตรวจความหนาทุกครั้งที่เข้าศูนย์ อย่ารอจนได้ยินเสียงโลหะเสียดสี' },
            { key: 'clutch_gearbox', label: 'ตรวจ/เปลี่ยนน้ำมันเกียร์+คลัตช์', icon: 'settings', km: 40000, months: 12,
              tip: 'สังเกตอาการคลัตช์ลื่นหรือเข้าเกียร์ฝืดระหว่างรอบตรวจ หากมีอาการให้เข้าศูนย์ก่อนกำหนด' },
            { key: 'diff_oil', label: 'เปลี่ยนน้ำมันเฟืองท้าย', icon: 'settings-2', km: 50000, months: 12,
              tip: 'ฟังเสียงหอนที่เฟืองท้ายขณะวิ่งความเร็วคงที่ ถ้ามีเสียงผิดปกติให้ตรวจก่อนกำหนด' },
            { key: 'suspension', label: 'ตรวจช่วงล่าง/แหนบ/บู๊ช/สลักเกลียว', icon: 'wrench', km: 20000, months: 6,
              tip: 'ตรวจแหนบแตกร้าวและขันน็อตล้อ-แหนบให้แน่นทุกรอบ ป้องกันอุบัติเหตุจากช่วงล่างหลุด' },
            { key: 'coolant', label: 'ตรวจ/เปลี่ยนน้ำยาหล่อเย็น', icon: 'thermometer', km: 40000, months: 24,
              tip: 'ตรวจระดับน้ำในหม้อพักทุกเช้าก่อนออกรถ หม้อน้ำรั่วซึมเป็นสาเหตุเครื่องยนต์โอเวอร์ฮีทอันดับต้น ๆ' },
            { key: 'battery', label: 'ตรวจแบตเตอรี่/ระบบไฟชาร์จ', icon: 'battery-charging', km: 0, months: 24,
              tip: 'วัดค่าไฟชาร์จและขั้วแบตทุก 3 เดือน แบตเสื่อมกะทันหันทำให้รถสตาร์ทไม่ติดกลางทางได้' },
            { key: 'tire_rotate', label: 'สลับ/ตรวจดอกยางทั้งคัน', icon: 'circle-dot', km: 10000, months: 6,
              tip: 'สลับยางตามคู่เพื่อให้ดอกยางสึกสม่ำเสมอ ช่วยยืดอายุยางและลดความเสี่ยงยางระเบิดกลางทาง' },
            { key: 'inspection', label: 'ตรวจสภาพรถประจำปี (ตรอ.) + พรบ./ภาษี', icon: 'file-check', km: 0, months: 12,
              tip: 'ต่อภาษี/พรบ./ตรวจสภาพให้ตรงกำหนดทุกปี รถขาดต่อทะเบียนจะถูกปรับและใช้วิ่งงานไม่ได้ตามกฎหมาย' },
            { key: 'other', label: 'งานซ่อมอื่น ๆ (ระบุเอง)', icon: 'hammer', km: 0, months: 0,
              tip: 'บันทึกรายละเอียดงานซ่อมในช่อง "รายละเอียดงานที่ทำ" ให้ครบถ้วนเพื่อประโยชน์ในการเบิกจ่ายและตรวจสอบย้อนหลัง' }
        ];

        const maintenanceTypeMap = {};
        MAINTENANCE_TYPES.forEach(t => maintenanceTypeMap[t.key] = t);

        // สถานะความเร่งด่วน: ok (ปกติ) / soon (ใกล้ถึงกำหนด) / due (ถึงกำหนดแล้ว) / overdue (เลยกำหนด)
        const MAINT_SOON_RATIO = 0.85; // เตือนล่วงหน้าเมื่อถึง 85% ของรอบระยะ/เวลา

        // ==========================================================
        // 🛞 ระบบยางรถบรรทุก 22 ตำแหน่ง (โครงหัวลาก 10 ล้อ + หางพ่วง 12 ล้อ)
        // ==========================================================
        const TIRE_ROTATE_KM = 10000;   // ควรสลับ/ตรวจดอกยาง
        const TIRE_MONITOR_KM = 60000;  // เริ่มจับตาความสึกใกล้หมดอายุ
        const TIRE_REPLACE_KM = 80000;  // แนะนำเปลี่ยนยางใหม่ (แนวทางทั่วไป ขึ้นกับรุ่นยาง/ลักษณะงาน)

        function getWheelLayout() {
            const axleDefs = [
                { id: 'front',    label: 'เพลาที่ 1 — เพลาหน้า (พวงมาลัย)', dual: false, y: 50,  group: 'head' },
                { id: 'drive1',   label: 'เพลาที่ 2 — เพลาขับหัวลาก',        dual: true,  y: 190, group: 'head' },
                { id: 'drive2',   label: 'เพลาที่ 3 — เพลาขับหัวลาก',        dual: true,  y: 300, group: 'head' },
                { id: 'trailer1', label: 'เพลาที่ 4 — เพลาหางพ่วง',          dual: true,  y: 470, group: 'trailer' },
                { id: 'trailer2', label: 'เพลาที่ 5 — เพลาหางพ่วง',          dual: true,  y: 580, group: 'trailer' },
                { id: 'trailer3', label: 'เพลาที่ 6 — เพลาหางพ่วง',          dual: true,  y: 690, group: 'trailer' }
            ];
            let pos = 1;
            const wheels = [];
            axleDefs.forEach(axle => {
                if (!axle.dual) {
                    wheels.push({ pos: pos++, axleId: axle.id, axleLabel: axle.label, side: 'L', x: 108, y: axle.y, w: 34, h: 62 });
                    wheels.push({ pos: pos++, axleId: axle.id, axleLabel: axle.label, side: 'R', x: 258, y: axle.y, w: 34, h: 62 });
                } else {
                    wheels.push({ pos: pos++, axleId: axle.id, axleLabel: axle.label, side: 'L', sub: 'นอก', x: 52,  y: axle.y, w: 26, h: 60 });
                    wheels.push({ pos: pos++, axleId: axle.id, axleLabel: axle.label, side: 'L', sub: 'ใน',  x: 86,  y: axle.y, w: 26, h: 60 });
                    wheels.push({ pos: pos++, axleId: axle.id, axleLabel: axle.label, side: 'R', sub: 'ใน',  x: 288, y: axle.y, w: 26, h: 60 });
                    wheels.push({ pos: pos++, axleId: axle.id, axleLabel: axle.label, side: 'R', sub: 'นอก', x: 322, y: axle.y, w: 26, h: 60 });
                }
            });
            return { axleDefs, wheels };
        }

        // ---- คำนวณเลขไมล์ปัจจุบันโดยประมาณ จาก "เลขไมล์ฐาน" + ระยะทางที่วิ่งงานสะสมหลังวันที่บันทึกฐาน ----
        function getEstimatedOdometer(plate) {
            const v = state.vehicles.find(x => x.plate === plate);
            if (!v) return 0;
            const baseOdo = Number(v.baselineOdometer || 0);
            const baseDate = v.baselineDate ? parseDateForSort(v.baselineDate) : 0;
            const extraDist = state.trips
                .filter(t => t.plate === plate && parseDateForSort(t.date) >= baseDate)
                .reduce((s, t) => s + Number(t.dist || 0), 0);
            return Math.round(baseOdo + extraDist);
        }

        function getVehicleByPlate(plate) {
            return state.vehicles.find(v => v.plate === plate);
        }

        // ---- ประเมินสถานะรายการซ่อมบำรุงแต่ละประเภทของรถคันหนึ่ง ----
        function getMaintenanceStatusForType(plate, typeKey) {
            const type = maintenanceTypeMap[typeKey];
            const currentOdo = getEstimatedOdometer(plate);
            const logs = state.maintenanceLogs
                .filter(m => m.plate === plate && m.category === typeKey)
                .sort((a, b) => parseDateForSort(b.date) - parseDateForSort(a.date));
            const lastLog = logs[0] || null;

            const lastOdo = lastLog ? Number(lastLog.odometer || 0) : 0;
            const lastDateTs = lastLog ? parseDateForSort(lastLog.date) : 0;
            const kmSince = currentOdo - lastOdo;
            const daysSince = lastLog ? Math.floor((Date.now() - lastDateTs) / 86400000) : null;
            const monthsSince = daysSince !== null ? daysSince / 30.44 : null;

            let ratio = 0;
            if (lastLog) {
                if (type.km > 0) ratio = Math.max(ratio, kmSince / type.km);
                if (type.months > 0) ratio = Math.max(ratio, monthsSince / type.months);
            }

            let status = 'ok';
            if (!lastLog) status = 'unknown'; // ยังไม่เคยมีประวัติในระบบ
            else if (ratio >= 1) status = 'overdue';
            else if (ratio >= MAINT_SOON_RATIO) status = 'soon';

            // ระยะ/วันที่ครบกำหนดถัดไป (โดยประมาณ)
            const nextOdo = lastLog ? lastOdo + type.km : null;
            const kmToGo = nextOdo !== null ? nextOdo - currentOdo : null;

            return { type, lastLog, currentOdo, lastOdo, kmSince, daysSince, monthsSince, ratio, status, nextOdo, kmToGo };
        }

        function getVehicleMaintenanceSummary(plate) {
            return MAINTENANCE_TYPES.filter(t => t.key !== 'other').map(t => getMaintenanceStatusForType(plate, t.key));
        }

        // ---- นับจำนวนรายการที่ต้องแจ้งเตือนทั้งกองรถ (ใช้ทำ badge แจ้งเตือน) ----
        function getFleetMaintenanceAlerts() {
            const alerts = [];
            state.vehicles.forEach(v => {
                getVehicleMaintenanceSummary(v.plate).forEach(s => {
                    if (s.status === 'overdue' || s.status === 'soon' || s.status === 'unknown') {
                        alerts.push({ plate: v.plate, vehicle: v, ...s });
                    }
                });
            });
            const rank = { overdue: 0, soon: 1, unknown: 2, ok: 3 };
            alerts.sort((a, b) => (rank[a.status] - rank[b.status]) || (b.ratio - a.ratio));
            return alerts;
        }

        // ---- สรุปสถานะรถทั้งกองแบบ "เขียว/เหลือง/แดง" ต่อคัน (ใช้กับการ์ด Hero) ----
        // ปกติ = ไม่มีรายการเกินกำหนด/ใกล้ถึงรอบเลย, ใกล้ถึงรอบ = มีรายการ soon อย่างน้อย 1, เกินกำหนด = มี overdue อย่างน้อย 1
        function getFleetStatusCounts(categoryFilter) {
            const vehicles = categoryFilter ? state.vehicles.filter(v => (v.category || 'flatbed') === categoryFilter) : state.vehicles;
            const counts = { ok: 0, soon: 0, overdue: 0 };
            vehicles.forEach(v => {
                const summary = getVehicleMaintenanceSummary(v.plate);
                if (summary.some(s => s.status === 'overdue')) counts.overdue++;
                else if (summary.some(s => s.status === 'soon')) counts.soon++;
                else counts.ok++;
            });
            return counts;
        }

        // ---- ฟีดกิจกรรมซ่อมบำรุงล่าสุด (ผสมงานที่ทำเสร็จแล้ว + รายการที่รอดำเนินการ) ----
        function getRecentMaintenanceActivity(categoryFilter, limit) {
            const vehicles = new Set((categoryFilter ? state.vehicles.filter(v => (v.category || 'flatbed') === categoryFilter) : state.vehicles).map(v => v.plate));
            const done = state.maintenanceLogs
                .filter(m => vehicles.has(m.plate))
                .sort((a, b) => parseDateForSort(b.date) - parseDateForSort(a.date))
                .slice(0, limit)
                .map(m => ({ plate: m.plate, label: (maintenanceTypeMap[m.category] || { label: m.category }).label, statusLabel: 'เสร็จแล้ว', done: true, sortKey: parseDateForSort(m.date) }));
            const pending = getFleetMaintenanceAlerts()
                .filter(a => (!categoryFilter || (a.vehicle.category || 'flatbed') === categoryFilter) && a.status !== 'unknown')
                .slice(0, limit)
                .map(a => ({ plate: a.plate, label: a.type.label, statusLabel: a.status === 'overdue' ? 'เกินกำหนด' : 'รอดำเนินการ', done: false, urgent: a.status === 'overdue', sortKey: Infinity }));
            return [...pending, ...done].slice(0, limit);
        }

        // ---- เที่ยวรถล่าสุด (วันนี้ก่อน ถ้าไม่มีค่อยใช้เที่ยวล่าสุดแทน) ----
        function getTodayOrRecentTrips(categoryFilter, limit) {
            const pool = categoryFilter ? state.trips.filter(t => (t.category || 'flatbed') === categoryFilter) : state.trips;
            const todayThai = formatToThaiShort(getToday());
            const todayTrips = pool.filter(t => formatDisplayDate(t.date) === formatDisplayDate(todayThai));
            const source = todayTrips.length > 0 ? todayTrips : [...pool].sort((a, b) => parseDateForSort(b.date) - parseDateForSort(a.date));
            return { isToday: todayTrips.length > 0, trips: source.slice(0, limit) };
        }

        // ==========================================================
        // 🎨 Hero banner ด้านบนของหน้าภาพรวม — สรุปสถานะรถ/ซ่อมบำรุง/เที่ยววิ่งแบบเห็นภาพไว
        // ==========================================================
        function buildHeroBanner() {
            const catName = state.activeCategory === 'flatbed' ? 'รถพื้นเรียบ' : 'รถเซมิดั๊ม';
            const statusCounts = getFleetStatusCounts(state.activeCategory);
            const activity = getRecentMaintenanceActivity(state.activeCategory, 4);
            const { isToday, trips: heroTrips } = getTodayOrRecentTrips(state.activeCategory, 4);
            const hour = new Date().getHours();
            const greeting = hour < 12 ? 'สวัสดีตอนเช้า' : hour < 17 ? 'สวัสดีตอนบ่าย' : 'สวัสดีตอนเย็น';
            const dotColors = ['#1e3350', '#4a76a8', '#fbbf24', '#8dadd1'];

            return `
                <div class="relative rounded-3xl overflow-hidden mb-8 shadow-lg border border-slate-200/70 bg-gradient-to-br from-white via-slate-50 to-navy-50">
                    <!-- แผงเหลี่ยมสีกรมท่า ตกแต่งด้านหลังคล้ายอาคารในภาพอ้างอิง -->
                    <div class="absolute inset-y-0 right-0 w-full md:w-[42%] pointer-events-none" style="background: linear-gradient(155deg, #22405f 0%, #1e3350 45%, #142338 100%); clip-path: polygon(28% 0, 100% 0, 100% 100%, 0% 100%);"></div>
                    <svg class="absolute inset-y-0 right-0 w-full md:w-[42%] h-full opacity-[0.08] pointer-events-none" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
                        <g stroke="#ffffff" stroke-width="2" fill="none">
                            <line x1="140" y1="0" x2="140" y2="300" /><line x1="200" y1="0" x2="200" y2="300" />
                            <line x1="260" y1="0" x2="260" y2="300" /><line x1="320" y1="0" x2="320" y2="300" />
                            <line x1="90" y1="60" x2="400" y2="60" /><line x1="60" y1="150" x2="400" y2="150" /><line x1="30" y1="230" x2="400" y2="230" />
                        </g>
                    </svg>

                    <div class="relative z-10 p-6 md:p-10">
                        <div class="flex flex-col md:flex-row md:items-center justify-between gap-8 mb-8">
                            <div class="flex-1 max-w-lg">
                                <div class="flex items-center gap-3 mb-5">
                                    <div class="w-12 h-12 rounded-2xl bg-navy-800 flex items-center justify-center shadow-md flex-shrink-0">
                                        <i data-lucide="truck" class="w-6 h-6 text-white"></i>
                                    </div>
                                    <div class="leading-tight">
                                        <p class="text-navy-900 font-extrabold text-base tracking-wide">FLEET PORTAL</p>
                                        <p class="text-navy-500 text-[10px] font-bold tracking-[0.25em] uppercase">${catName}</p>
                                    </div>
                                </div>
                                <h2 class="text-navy-900 text-2xl md:text-[26px] font-bold mb-2">${greeting} ยินดีต้อนรับสู่ระบบจัดการรถ</h2>
                                <p class="text-slate-500 text-sm">ภาพรวมสถานะยานพาหนะ งานซ่อมบำรุง และเที่ยววิ่งงาน${isToday ? 'ของวันนี้' : 'ล่าสุด'} ในที่เดียว</p>
                            </div>
                            <div class="hidden md:flex items-center justify-center flex-shrink-0 pr-2 lg:pr-6">
                                <div class="w-24 h-24 rounded-full border-2 border-white/25 flex items-center justify-center">
                                    <div class="w-16 h-16 rounded-full bg-white/10 backdrop-blur-sm flex items-center justify-center">
                                        <i data-lucide="truck" class="w-9 h-9 text-white"></i>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4">
                            <div class="bg-white/95 backdrop-blur-sm border border-slate-200 rounded-2xl p-5 shadow-sm">
                                <div class="flex items-center space-x-3 mb-4">
                                    <div class="w-10 h-10 rounded-xl bg-navy-50 flex items-center justify-center flex-shrink-0"><i data-lucide="truck" class="w-5 h-5 text-navy-800"></i></div>
                                    <p class="text-slate-800 font-bold text-sm">สถานะยานพาหนะ</p>
                                </div>
                                <div class="space-y-2.5">
                                    <div class="flex items-center justify-between text-sm"><span class="flex items-center text-slate-500"><span class="w-2 h-2 rounded-full bg-emerald-500 mr-2"></span>ปกติ</span><span class="font-bold text-slate-800">${statusCounts.ok}</span></div>
                                    <div class="flex items-center justify-between text-sm"><span class="flex items-center text-slate-500"><span class="w-2 h-2 rounded-full bg-amber-500 mr-2"></span>ใกล้ถึงรอบ</span><span class="font-bold text-slate-800">${statusCounts.soon}</span></div>
                                    <div class="flex items-center justify-between text-sm"><span class="flex items-center text-slate-500"><span class="w-2 h-2 rounded-full bg-rose-500 mr-2"></span>เกินกำหนด</span><span class="font-bold text-slate-800">${statusCounts.overdue}</span></div>
                                </div>
                            </div>

                            <div class="bg-white/95 backdrop-blur-sm border border-slate-200 rounded-2xl p-5 shadow-sm">
                                <div class="flex items-center justify-between mb-4">
                                    <div class="flex items-center space-x-3"><div class="w-10 h-10 rounded-xl bg-navy-50 flex items-center justify-center flex-shrink-0"><i data-lucide="wrench" class="w-5 h-5 text-navy-800"></i></div><p class="text-slate-800 font-bold text-sm">ประวัติซ่อมบำรุงล่าสุด</p></div>
                                    <button onclick="changeTab('${state.activeCategory}','maintenance'); renderNav(); renderContent();" class="text-slate-400 hover:text-navy-800 transition-colors"><i data-lucide="more-horizontal" class="w-4 h-4"></i></button>
                                </div>
                                <div class="space-y-2.5">
                                    ${activity.length === 0 ? `<p class="text-slate-400 text-xs">ยังไม่มีข้อมูล</p>` : activity.map(a => `
                                        <div class="flex items-center justify-between text-xs gap-2">
                                            <span class="text-slate-600 truncate">${a.plate}: ${a.label}</span>
                                            <span class="flex-shrink-0 px-2 py-0.5 rounded-full text-[10px] font-bold ${a.done ? 'bg-emerald-100 text-emerald-700' : a.urgent ? 'bg-rose-100 text-rose-700' : 'bg-amber-100 text-amber-700'}">${a.statusLabel}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>

                            <div class="bg-white/95 backdrop-blur-sm border border-slate-200 rounded-2xl p-5 shadow-sm">
                                <div class="flex items-center justify-between mb-4">
                                    <div class="flex items-center space-x-3"><div class="w-10 h-10 rounded-xl bg-navy-50 flex items-center justify-center flex-shrink-0"><i data-lucide="map-pin" class="w-5 h-5 text-navy-800"></i></div><p class="text-slate-800 font-bold text-sm">${isToday ? 'เที่ยวรถวันนี้' : 'เที่ยวรถล่าสุด'}</p></div>
                                    <button onclick="changeTab('${state.activeCategory}','trips'); renderNav(); renderContent();" class="text-slate-400 hover:text-navy-800 transition-colors"><i data-lucide="more-horizontal" class="w-4 h-4"></i></button>
                                </div>
                                <div class="space-y-2.5">
                                    ${heroTrips.length === 0 ? `<p class="text-slate-400 text-xs">ยังไม่มีข้อมูลการวิ่งงาน</p>` : heroTrips.map((t, i) => `
                                        <div class="flex items-center text-xs gap-2">
                                            <span class="w-1.5 h-1.5 rounded-full flex-shrink-0" style="background:${dotColors[i % dotColors.length]}"></span>
                                            <span class="text-slate-600 truncate">${t.plate}: ${t.origin} → ${t.dest}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // ---- ข้อความคำแนะนำสไตล์ช่างศูนย์ ----
        function getAdvisorMessage(statusItem) {
            const { type, status, kmSince, kmToGo, daysSince } = statusItem;
            if (status === 'unknown') {
                return `ยังไม่มีประวัติรายการนี้ในระบบ แนะนำให้ตรวจเช็คครั้งแรกเพื่อเริ่มนับรอบให้แม่นยำ — ${type.tip}`;
            }
            if (status === 'overdue') {
                return `เลยกำหนด${type.km > 0 && kmToGo !== null ? ' มา ' + formatNumber(Math.abs(kmToGo)).replace(/\.00$/, '') + ' กม.แล้ว' : ''} ควรรีบนำรถเข้าศูนย์โดยเร็ว — ${type.tip}`;
            }
            if (status === 'soon') {
                return `ใกล้ถึงรอบแล้ว${kmToGo !== null && kmToGo > 0 ? ' อีกประมาณ ' + formatNumber(kmToGo).replace(/\.00$/, '') + ' กม.' : ''} วางแผนจองคิวศูนย์ล่วงหน้าได้เลย — ${type.tip}`;
            }
            return `สภาพยังปกติ ยังไม่ถึงรอบ — ${type.tip}`;
        }

        // ---- Helper ยางรถ: หายางที่ใช้งานอยู่ ณ ตำแหน่งนั้น / ประวัติยางเก่า / สถานะความสึก ----
        function getActiveTireAt(plate, pos) {
            return state.tires.find(t => t.plate === plate && Number(t.position) === Number(pos) && t.status === 'active') || null;
        }

        function getTireHistoryAt(plate, pos) {
            return state.tires

                    if (dateStr !== '-') {
                        const parts = dateStr.split('/');
                        if (parts.length === 3) {
                            const d = parseInt(parts[0], 10);
                            const m = parseInt(parts[1], 10);
                            let y = parseInt(parts[2], 10);
                            
                            if (y < 2500) y += 543;

                            matchPeriod = (y === state.filterYear && m === state.filterMonth && p === state.filterPeriod);
                        } else { matchPeriod = false; }
                    } else { matchPeriod = false; }
                }
                return matchPeriod;
            });

                        const mo = parseInt(parts[1], 10);
                        let y = parseInt(parts[2], 10);
                        if (y < 2500) y += 543;
                        const p = d <= 15 ? 1 : 2;
                        return y === state.filterYear && mo === state.filterMonth && p === state.filterPeriod;

                    return false;

        }

        function renderVehicles(container) {

            filteredVehicles.forEach(v => {

                if (overdueCount > 0) badgeHtml = `<span class="bg-rose-100 text-rose-700 text-xs font-bold px-2 py-1 rounded-full flex items-center whitespace-nowrap"><i data-lucide="alert-triangle" class="w-3 h-3 mr-1"></i>เกินกำหนด ${overdueCount}</span>`;
                else if (soonCount > 0) badgeHtml = `<span class="bg-amber-100 text-amber-700 text-xs font-bold px-2 py-1 rounded-full flex items-center whitespace-nowrap"><i data-lucide="clock" class="w-3 h-3 mr-1"></i>ใกล้ถึงรอบ ${soonCount}</span>`;
                else if (unknownCount > 0) badgeHtml = `<span class="bg-slate-100 text-slate-600 text-xs font-bold px-2 py-1 rounded-full flex items-center whitespace-nowrap"><i data-lucide="file-question" class="w-3 h-3 mr-1"></i>ไร้ประวัติ ${unknownCount}</span>`;

                html += `

                        <div class="flex items-center justify-between mb-3 gap-2">

                            ${badgeHtml}
                        </div>
                        <p class="text-sm text-slate-500">${v.model || '-'} ${v.year ? `(ปี ${v.year})` : ''}</p>
                        <p class="text-sm text-slate-500">คนขับ: ${v.driver || '-'}</p>
                        <p class="text-lg font-bold text-slate-800 mt-2">${formatNumber(getEstimatedOdometer(v.plate)).replace(/\.00$/, '')} <span class="text-sm font-normal text-slate-400">กม.</span></p>
                    </button>
                `;
            });
            html += `</div>`;

            if (!detailVehicle) {
                const catAlerts = getFleetMaintenanceAlerts().filter(a => (a.vehicle.category || 'flatbed') === state.activeCategory);
                if (catAlerts.length > 0) {
                    html += `
                        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
                            <h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center"><i data-lucide="bell-ring" class="h-5 w-5 mr-2 text-navy-800"></i>รายการที่ควรติดตาม <span class="text-sm font-normal text-slate-400 ml-2">(คลิกการ์ดรถด้านบนเพื่อดูรายละเอียด/บันทึก)</span></h3>
                            <div class="space-y-2">
                            ${catAlerts.slice(0, 10).map(a => `
                                <div class="flex items-center justify-between p-3 rounded-xl ${a.status === 'overdue' ? 'bg-rose-50' : a.status === 'soon' ? 'bg-amber-50' : 'bg-slate-50'}">
                                    <div class="flex items-center space-x-3">
                                        <i data-lucide="${a.type.icon}" class="w-4 h-4 ${a.status === 'overdue' ? 'text-rose-700' : a.status === 'soon' ? 'text-amber-700' : 'text-slate-500'}"></i>
                                        <span class="font-semibold text-slate-700">${a.plate}</span>

                                    <span class="text-xs font-bold ${a.status === 'overdue' ? 'text-rose-700' : a.status === 'soon' ? 'text-amber-700' : 'text-slate-500'}">${a.status === 'overdue' ? 'เกินกำหนด' : a.status === 'soon' ? 'ใกล้ถึงรอบ' : 'ยังไม่มีประวัติ'}</span>
                                </div>

                            </div>

                    html += `<div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-8 text-center text-slate-500">เลือกรถจากการ์ดด้านบนเพื่อดูคำแนะนำจากช่างศูนย์และประวัติการซ่อม</div>`;

                return rank[a.status] - rank[b.status];
            });
            const myLogs = state.maintenanceLogs.filter(m => m.plate === detailVehicle.plate).sort((a, b) => parseDateForSort(b.date) - parseDateForSort(a.date));
            const totalCost = myLogs.reduce((s, m) => s + Number(m.cost || 0), 0);

            html += `
                <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 mb-6">

                            <button onclick="state.activeVehiclePlate=null; renderContent();" class="text-slate-400 hover:text-navy-700 p-2 rounded-full hover:bg-navy-50"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>

                            <div class="text-right"><p class="text-xs text-slate-400 font-bold uppercase">ค่าซ่อมบำรุงสะสม</p><p class="text-2xl font-bold text-orange-600 break-words w-full">${formatCurrency(totalCost)}</p></div>
                        </div>
                    </div>
                </div>

                <div class="bg-gradient-to-br from-slate-800 to-slate-900 rounded-2xl shadow-sm p-6 mb-6 text-white">
                    <div class="flex items-center space-x-3 mb-4">
                        <div class="bg-white/10 w-11 h-11 rounded-full flex items-center justify-center flex-shrink-0"><i data-lucide="hard-hat" class="w-6 h-6 text-amber-400"></i></div>

                            <p class="font-bold">${TECH_NAME} · ${TECH_TITLE}</p>
                            <p class="text-xs text-slate-300">คำแนะนำอัตโนมัติจากระยะทาง/ระยะเวลาที่บันทึกไว้ — โปรดตรวจสอบกับศูนย์บริการจริงอีกครั้งก่อนตัดสินใจ</p>

                    <div class="space-y-2">
                        ${summary.map(s => renderAdvisorRow(detailVehicle.plate, s)).join('')}

                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="bg-navy-50/50 px-6 py-4 border-b border-slate-200"><h3 class="text-lg font-bold text-slate-800">ประวัติงานซ่อมบำรุง</h3></div>
                    <div class="overflow-x-auto">
                        <table class="w-full min-w-[900px] text-left border-collapse whitespace-nowrap">
                            <thead>
                                <tr class="bg-white text-slate-500 text-sm uppercase tracking-wider border-b border-slate-200">
                                    <th class="p-4 font-semibold">วันที่</th><th class="p-4 font-semibold">ประเภทงาน</th><th class="p-4 font-semibold">รายละเอียด</th>
                                    <th class="p-4 font-semibold text-right">เลขไมล์</th><th class="p-4 font-semibold text-right">ค่าใช้จ่าย</th><th class="p-4 font-semibold">ช่าง/ศูนย์</th><th class="p-4 font-semibold text-center">จัดการ</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100">
                            ${myLogs.length === 0 ? `<tr><td colspan="7" class="p-8 text-center text-slate-500">ยังไม่มีประวัติการซ่อมบำรุง</td></tr>` : myLogs.map(m => `

        function renderAdvisorRow(plate, s) {
            const border = { overdue: 'bg-rose-500/20 border-rose-400/40', soon: 'bg-amber-500/20 border-amber-400/40', unknown: 'bg-slate-500/20 border-slate-400/40', ok: 'bg-white/5 border-white/10' };
            const badge = { overdue: 'bg-rose-500 text-white', soon: 'bg-amber-400 text-slate-900', unknown: 'bg-slate-400 text-slate-900', ok: 'bg-emerald-500 text-white' };
            const label = { overdue: 'เกินกำหนด', soon: 'ใกล้ถึงรอบ', unknown: 'ไร้ประวัติ', ok: 'ปกติ' };
            return `
                <div class="flex items-start justify-between gap-4 p-3 rounded-xl border ${border[s.status]}">
                    <div class="flex items-start space-x-3">
                        <i data-lucide="${s.type.icon}" class="w-4 h-4 mt-1 text-slate-300 flex-shrink-0"></i>
                        <div>
                            <p class="font-semibold text-sm">${s.type.label} <span class="text-[10px] font-bold ml-1 px-1.5 py-0.5 rounded ${badge[s.status]}">${label[s.status]}</span></p>

                        </div>
                    </div>
                    <button onclick="quickLogMaintenance('${s.type.key}')" class="flex-shrink-0 text-xs font-bold bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-lg whitespace-nowrap">บันทึกว่าทำแล้ว</button>
                </div>
            `;
        }

        window.quickLogMaintenance = (typeKey) => {
            state.formData = { plate: state.activeVehiclePlate, category: typeKey, date: getToday(), odometer: getEstimatedOdometer(state.activeVehiclePlate) };
            state.editMode = false;
            openFormModal(false);
        };

        // ==========================================================
        // 🛞 หน้าจอระบบยางรถ 22 ตำแหน่ง
        // ==========================================================
        function renderTires(container) {
            const filteredVehicles = state.vehicles.filter(v => (v.category || 'flatbed') === state.activeCategory);
            if (filteredVehicles.length === 0) {
                container.innerHTML = `<div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-8 text-center text-slate-500">ยังไม่มีข้อมูลรถในหมวดนี้ กรุณาเพิ่มรถที่แท็บ "ข้อมูลรถและคนขับ" ก่อน</div>`;
                return;
            }
            if (!filteredVehicles.find(v => v.plate === state.activeVehiclePlate)) {
                state.activeVehiclePlate = filteredVehicles[0].plate;
            }
            const plate = state.activeVehiclePlate;

            let html = `<div class="flex flex-wrap gap-2 mb-6">`;
            filteredVehicles.forEach(v => {
                const active = v.plate === plate;
                html += `<button onclick="state.activeVehiclePlate='${v.plate}'; renderContent();" class="px-4 py-2 rounded-full text-sm font-bold border transition-colors ${active ? 'bg-navy-800 text-white border-navy-800' : 'bg-white text-slate-600 border-slate-200 hover:border-navy-300'}">${v.plate}</button>`;
            });
            html += `</div>`;

            const { wheels } = getWheelLayout();
            let goodCount = 0, monitorCount = 0, warnCount = 0, overdueCount = 0, emptyCount = 0;
            wheels.forEach(w => {
                const rec = getActiveTireAt(plate, w.pos);
                const st = getTireStatus(plate, rec);
                if (st === 'good') goodCount++;
                else if (st === 'monitor') monitorCount++;
                else if (st === 'warn') warnCount++;
                else if (st === 'overdue') overdueCount++;
                else emptyCount++;
            });

            html += `
                <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3 mb-6">
                    <div class="bg-white p-3 rounded-xl border border-slate-200 text-center"><p class="text-xs text-slate-400 font-bold">ปกติ</p><p class="text-xl font-bold text-emerald-600 break-words w-full">${goodCount}</p></div>
                    <div class="bg-white p-3 rounded-xl border border-slate-200 text-center"><p class="text-xs text-slate-400 font-bold">ควรสลับยาง</p><p class="text-xl font-bold text-amber-600 break-words w-full">${monitorCount}</p></div>
                    <div class="bg-white p-3 rounded-xl border border-slate-200 text-center"><p class="text-xs text-slate-400 font-bold">จับตาความสึก</p><p class="text-xl font-bold text-orange-600 break-words w-full">${warnCount}</p></div>
                    <div class="bg-white p-3 rounded-xl border border-slate-200 text-center"><p class="text-xs text-slate-400 font-bold">ควรเปลี่ยน</p><p class="text-xl font-bold text-rose-600 break-words w-full">${overdueCount}</p></div>
                    <div class="bg-white p-3 rounded-xl border border-slate-200 text-center"><p class="text-xs text-slate-400 font-bold">ยังไม่บันทึก</p><p class="text-xl font-bold text-slate-400 break-words w-full">${emptyCount}</p></div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="lg:col-span-2 bg-white rounded-2xl shadow-sm border border-slate-100 p-6 flex flex-col items-center">
                        <h3 class="text-lg font-bold text-slate-800 mb-1 self-start flex items-center"><i data-lucide="circle-dot" class="h-5 w-5 mr-2 text-navy-800"></i>ผังตำแหน่งยาง — ${plate}</h3>
                        <p class="text-xs text-slate-400 mb-2 self-start">คลิกที่ล้อเพื่อดู/บันทึกรายละเอียดยางแต่ละเส้น (22 ตำแหน่ง: หัวลาก 10 + หางพ่วง 12)</p>
                        ${buildWheelSvg(plate)}
                    </div>
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
                        <h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center"><i data-lucide="list" class="h-5 w-5 mr-2 text-navy-800"></i>คำอธิบายสัญลักษณ์</h3>
                        <div class="space-y-3 text-sm">
                            <div class="flex items-center space-x-3"><span class="w-4 h-4 rounded-full bg-slate-800 border-2 border-emerald-500 flex-shrink-0"></span><span>ปกติ — วิ่งมาไม่เกิน ${formatNumber(TIRE_ROTATE_KM).replace(/\.00$/, '')} กม.</span></div>
                            <div class="flex items-center space-x-3"><span class="w-4 h-4 rounded-full bg-slate-800 border-2 border-amber-500 flex-shrink-0"></span><span>ควรสลับ/ตรวจดอกยาง — เกิน ${formatNumber(TIRE_ROTATE_KM).replace(/\.00$/, '')} กม.</span></div>
                            <div class="flex items-center space-x-3"><span class="w-4 h-4 rounded-full bg-slate-800 border-2 border-orange-500 flex-shrink-0"></span><span>จับตาความสึก — เกิน ${formatNumber(TIRE_MONITOR_KM).replace(/\.00$/, '')} กม.</span></div>
                            <div class="flex items-center space-x-3"><span class="w-4 h-4 rounded-full bg-slate-800 border-2 border-rose-600 flex-shrink-0"></span><span>ควรเปลี่ยนยางใหม่ — เกิน ${formatNumber(TIRE_REPLACE_KM).replace(/\.00$/, '')} กม.</span></div>
                            <div class="flex items-center space-x-3"><span class="w-4 h-4 rounded-full bg-slate-200 border-2 border-slate-400 flex-shrink-0" style="border-style:dashed"></span><span>ยังไม่บันทึกข้อมูลยาง</span></div>
                        </div>
                        <div class="mt-6 p-3 bg-sky-50 text-sky-800 rounded-lg text-xs border border-sky-200">
                            <i data-lucide="info" class="w-3.5 h-3.5 inline mr-1 mb-0.5"></i>
                            เลขไมล์ที่ใช้คำนวณอายุยาง อ้างอิงจาก "เลขไมล์ปัจจุบัน (ประเมิน)" ของรถคันนี้ = ${formatNumber(getEstimatedOdometer(plate)).replace(/\.00$/, '')} กม.
                        </div>
                        <div class="mt-3 p-3 bg-slate-50 text-slate-500 rounded-lg text-xs border border-slate-200">
                            เพลาที่ 1–3 = ฝั่งหัวลาก · เพลาที่ 4–6 = ฝั่งหางพ่วง (คั่นด้วยจุดพ่วง/Fifth Wheel)
                        </div>
                    </div>
                </div>
            `;
            container.innerHTML = html;
        }

        function buildWheelSvg(plate) {
            const { axleDefs, wheels } = getWheelLayout();
            let svg = `<svg viewBox="0 0 380 760" class="w-full max-w-sm mx-auto select-none">`;

            svg += `<rect x="150" y="8" width="80" height="58" rx="14" fill="#94a3b8" opacity="0.35" />`;
            svg += `<text x="190" y="42" text-anchor="middle" font-size="11" fill="#475569" font-weight="700">ห้องโดยสาร</text>`;
            svg += `<line x1="190" y1="18" x2="190" y2="335" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round" />`;
            svg += `<circle cx="190" cy="378" r="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="3" stroke-dasharray="4 3" />`;
            svg += `<text x="190" y="408" text-anchor="middle" font-size="9" fill="#94a3b8">จุดพ่วง (Fifth Wheel)</text>`;
            svg += `<line x1="190" y1="425" x2="190" y2="715" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round" />`;

            axleDefs.forEach((axle, idx) => {
                const xs = axle.dual ? [65, 315] : [125, 255];
                svg += `<line x1="${xs[0]}" y1="${axle.y}" x2="${xs[1]}" y2="${axle.y}" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" />`;
                svg += `<text x="12" y="${axle.y + 4}" font-size="9" fill="#94a3b8" font-weight="700">${idx + 1}</text>`;
            });

            wheels.forEach(w => {
                const rec = getActiveTireAt(plate, w.pos);
                const status = getTireStatus(plate, rec);
                const style = TIRE_STATUS_STYLE[status];
                const dash = status === 'empty' ? 'stroke-dasharray="5 4"' : '';
                svg += `
                    <g onclick="openTireModal('${plate}', ${w.pos})" style="cursor:pointer">
                        <rect x="${w.x - w.w / 2}" y="${w.y - w.h / 2}" width="${w.w}" height="${w.h}" rx="8" fill="${style.fill}" stroke="${style.stroke}" stroke-width="3" ${dash} />
                        <circle cx="${w.x}" cy="${w.y}" r="12" fill="#ffffff" stroke="${style.stroke}" stroke-width="2.5" />
                        <text x="${w.x}" y="${w.y + 4}" text-anchor="middle" font-size="11" font-weight="800" fill="${style.stroke}">${w.pos}</text>
                    </g>
                `;
            });

            svg += `</svg>`;
            return svg;
        }

        // ---- ตัวจัดการ modal รายละเอียดยางต่อ 1 ตำแหน่ง ----
        let currentTireCtx = { plate: null, pos: null };

        window.openTireModal = (plate, pos) => {
            currentTireCtx = { plate, pos };
            renderTireModalBody();
            document.getElementById('tire-modal').classList.remove('hidden');
        };

        window.closeTireModal = () => {
            document.getElementById('tire-modal').classList.add('hidden');
        };

        async function sendGasAction(action, data) {
            if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes("ใส่_URL")) return false;
            try {
                const res = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action, data })
                });
                const result = await res.json();
                if (result.status !== 'success') {
                    showToast('บันทึกไม่สำเร็จ: ' + (result.message || 'เกิดข้อผิดพลาดที่ฝั่งเซิร์ฟเวอร์'), 'error');
                    return false;
                }
                return true;
            } catch (e) {
                console.error('sendGasAction error', e);
                showToast('เชื่อมต่อฐานข้อมูลไม่สำเร็จ (' + e.message + ') — ข้อมูลอาจไม่ถูกบันทึกจริง กด "รีเฟรชข้อมูล" เพื่อตรวจสอบ', 'error');
                return false;
            }
        }

        window.renderTireModalBody = (formMode) => {
            const { plate, pos } = currentTireCtx;
            const { wheels } = getWheelLayout();
            const wheelInfo = wheels.find(w => w.pos === pos);
            const rec = getActiveTireAt(plate, pos);
            const history = getTireHistoryAt(plate, pos);
            const sideLabel = wheelInfo.side === 'L' ? 'ซ้าย' : 'ขวา';
            document.getElementById('tire-modal-title').innerText = `ล้อตำแหน่งที่ ${pos} — ${wheelInfo.axleLabel} (${sideLabel}${wheelInfo.sub ? ' ' + wheelInfo.sub : ''})`;
            const body = document.getElementById('tire-modal-body');

            if (formMode === 'add' || formMode === 'edit' || formMode === 'replace') {
                const editingRec = formMode === 'edit' ? rec : null;
                const currentOdo = getEstimatedOdometer(plate);
                body.innerHTML = `
                    <form id="tire-form" class="space-y-4">
                        ${formMode === 'replace' ? `<div class="p-3 bg-amber-50 text-amber-800 rounded-lg text-xs border border-amber-200">กำลังถอดยางเส้นเดิมออก และบันทึกยางเส้นใหม่ที่ตำแหน่งนี้</div>` : ''}
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">ยี่ห้อ/รุ่นยาง</label>
                            <input required type="text" id="tf_brand" value="${editingRec ? (editingRec.brand || '') : ''}" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-navy-800" placeholder="เช่น Bridgestone R150" />
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">เลขซีเรียลยาง (DOT/Serial)</label>
                            <input type="text" id="tf_serial" value="${editingRec ? (editingRec.serial || '') : ''}" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-navy-800" placeholder="เช่น 1224XXXX" />
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">วันที่เริ่มใส่ยาง</label>
                                <input required type="date" id="tf_date" value="${editingRec && editingRec.installDate ? reverseThaiToISO(editingRec.installDate) : getToday()}" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-navy-800" />
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">เลขไมล์ขณะใส่ยาง</label>
                                <input required type="number" id="tf_odo" value="${editingRec ? editingRec.installOdometer : currentOdo}" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-navy-800" />
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">หมายเหตุ</label>
                            <textarea id="tf_notes" rows="2" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-navy-800">${editingRec ? (editingRec.notes || '') : ''}</textarea>
                        </div>
                        <div class="flex space-x-3 pt-2">
                            <button type="button" onclick="renderTireModalBody()" class="flex-1 px-4 py-2 bg-white border border-slate-300 rounded-lg text-slate-700 hover:bg-slate-50 font-medium">ยกเลิก</button>
                            <button type="submit" class="flex-1 px-4 py-2 bg-navy-800 text-white rounded-lg hover:bg-navy-900 font-medium">บันทึก</button>
                        </div>
                    </form>
                `;
                document.getElementById('tire-form').onsubmit = (e) => submitTireForm(e, formMode, editingRec);
                lucide.createIcons();
                return;
            }

            const status = getTireStatus(plate, rec);
            const style = TIRE_STATUS_STYLE[status];
            const km = rec ? getTireRunKm(plate, rec) : 0;

            let html = '';
            if (rec) {
                html += `
                    <div class="p-4 rounded-xl border ${status === 'overdue' ? 'bg-rose-50 border-rose-200' : status === 'warn' ? 'bg-orange-50 border-orange-200' : status === 'monitor' ? 'bg-amber-50 border-amber-200' : 'bg-emerald-50 border-emerald-200'} mb-4">
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <p class="font-bold text-slate-800">${rec.brand || 'ไม่ระบุยี่ห้อ'}</p>
                                <p class="text-xs text-slate-500">S/N: ${rec.serial || '-'}</p>
                            </div>
                            <span class="text-xs font-bold px-2 py-1 rounded-full ${style.badge} whitespace-nowrap">${style.label}</span>
                        </div>
                        <div class="grid grid-cols-2 gap-2 text-sm mt-3">
                            <div><p class="text-slate-400 text-xs">เริ่มใส่</p><p class="font-semibold text-slate-700">${formatDisplayDate(rec.installDate)}</p></div>
                            <div><p class="text-slate-400 text-xs">เลขไมล์เริ่มต้น</p><p class="font-semibold text-slate-700">${formatNumber(rec.installOdometer).replace(/\.00$/, '')} กม.</p></div>
                            <div class="col-span-2"><p class="text-slate-400 text-xs">ระยะทางที่ใช้งานมาแล้ว</p><p class="font-bold text-slate-800 text-lg">${formatNumber(km).replace(/\.00$/, '')} กม.</p></div>
                        </div>
                        ${rec.notes ? `<p class="text-xs text-slate-500 mt-2 border-t border-slate-200/60 pt-2">📝 ${rec.notes}</p>` : ''}
                    </div>
                    <div class="flex space-x-2 mb-3">
                        <button onclick="requestActionPin('renderTireModalBody(\\'edit\\')')" class="flex-1 px-3 py-2 bg-slate-100 hover:bg-slate-200 rounded-lg text-sm font-bold text-slate-700 flex items-center justify-center"><i data-lucide="edit" class="w-4 h-4 mr-1"></i>แก้ไข</button>
                        <button onclick="requestActionPin('renderTireModalBody(\\'replace\\')')" class="flex-1 px-3 py-2 bg-navy-100 hover:bg-navy-200 rounded-lg text-sm font-bold text-navy-800 flex items-center justify-center"><i data-lucide="refresh-cw" class="w-4 h-4 mr-1"></i>เปลี่ยนยางใหม่</button>
                    </div>
                    <button onclick="requestActionPin('deleteTireRecord(\\'${rec.id}\\')')" class="w-full text-center text-xs text-slate-400 hover:text-red-500 mb-2">ลบข้อมูลเส้นนี้ทั้งหมด</button>
                `;
            } else {
                html += `
                    <div class="p-6 rounded-xl border border-dashed border-slate-300 text-center mb-2">
                        <i data-lucide="circle-dot" class="w-8 h-8 mx-auto text-slate-300 mb-2"></i>
                        <p class="text-slate-500 text-sm mb-4">ยังไม่มีข้อมูลยางที่ตำแหน่งนี้</p>
                        <button onclick="renderTireModalBody('add')" class="px-4 py-2 bg-navy-800 text-white rounded-lg text-sm font-bold hover:bg-navy-900">+ บันทึกยางเส้นนี้</button>
                    </div>
                `;
            }

            if (history.length > 0) {
                html += `
                    <div class="border-t border-slate-100 pt-3 mt-2">
                        <p class="text-xs font-bold text-slate-400 uppercase mb-2">ประวัติยางเส้นก่อนหน้า (${history.length})</p>
                        <div class="space-y-2 max-h-40 overflow-y-auto">
                        ${history.map(h => `
                            <div class="text-xs bg-slate-50 rounded-lg p-2 border border-slate-100">
                                <p class="font-semibold text-slate-600">${h.brand || 'ไม่ระบุยี่ห้อ'} <span class="text-slate-400">(${formatDisplayDate(h.installDate)} — ${h.removeDate ? formatDisplayDate(h.removeDate) : '-'})</span></p>
                                <p class="text-slate-400">ใช้งาน ${formatNumber(getTireRunKm(plate, h)).replace(/\.00$/, '')} กม.</p>
                            </div>
                        `).join('')}
                        </div>
                    </div>
                `;
            }

            body.innerHTML = html;
            lucide.createIcons();
        };

        window.submitTireForm = (e, mode, editingRec) => {
            e.preventDefault();
            const { plate, pos } = currentTireCtx;
            const getVal = (id) => document.getElementById(id)?.value;

            if (mode === 'replace') {
                const activeRec = getActiveTireAt(plate, pos);
                if (activeRec) {
                    activeRec.status = 'removed';
                    activeRec.removeDate = formatToThaiShort(getVal('tf_date'));
                    activeRec.removeOdometer = Number(getVal('tf_odo') || 0);
                    sendGasAction('editTire', activeRec);
                }
            }

            let rec = (mode === 'edit' && editingRec) ? editingRec : { id: Date.now(), plate: plate, position: pos };
            rec.brand = getVal('tf_brand');
            rec.serial = getVal('tf_serial');
            rec.installDate = formatToThaiShort(getVal('tf_date'));
            rec.installOdometer = Number(getVal('tf_odo') || 0);
            rec.notes = getVal('tf_notes') || '';
            rec.status = 'active';

            if (mode === 'edit') {
                state.tires = state.tires.map(t => t.id == rec.id ? rec : t);
                sendGasAction('editTire', rec);
            } else {
                state.tires.unshift(rec);
                sendGasAction('addTire', rec);
            }

            showToast('บันทึกข้อมูลยางสำเร็จ!', 'success');
            renderTireModalBody();
            renderContent();
        };

        window.deleteTireRecord = (id) => {
            customConfirm("ยืนยันการลบข้อมูลยางเส้นนี้ทั้งหมด (ลบแล้วกู้คืนไม่ได้)", async () => {
                sendGasAction('deleteTire', { id });
                state.tires = state.tires.filter(t => t.id != id);
                closeTireModal();
                renderContent();
                showToast('ลบข้อมูลยางสำเร็จ!');
            });
        };

        function drawCharts(profitData) {
            if(state.charts.bar) state.charts.bar.destroy();
            if(state.charts.line) state.charts.line.destroy();

            const labels = profitData.map(d => d.name);
            const profit = profitData.map(d => d.กำไร);
            const fuel = profitData.map(d => d.ค่าน้ำมัน);
            const revenue = profitData.map(d => d.ยอดรับ);

            const ctxBar = document.getElementById('chartBar').getContext('2d');
            state.charts.bar = new Chart(ctxBar, {
                type: 'bar',
                data: { labels: labels, datasets: [ { label: 'กำไร', data: profit, backgroundColor: '#10b981', borderRadius: 4 }, { label: 'ค่าน้ำมัน', data: fuel, backgroundColor: '#f97316', borderRadius: 4 } ] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'top' } }, scales: { y: { beginAtZero: true } } }
            });

            const ctxLine = document.getElementById('chartLine').getContext('2d');
            state.charts.line = new Chart(ctxLine, {
                type: 'line',
                data: { labels: labels, datasets: [ { label: 'ยอดรับ', data: revenue, borderColor: '#1e3350', backgroundColor: '#1e3350', tension: 0.3, borderWidth: 3 }, { label: 'กำไร', data: profit, borderColor: '#10b981', backgroundColor: '#10b981', tension: 0.3, borderWidth: 3 } ] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'top' } }, scales: { y: { beginAtZero: true } } }
            });
        }

        window.toggleJobSort = () => {
            state.jobSortMode = state.jobSortMode === 'recent' ? 'alpha' : 'recent';
            
            const sel = document.getElementById('job_select');
            if(sel) {
                // จำค่าเดิมที่เลือกไว้ก่อนสลับการจัดเรียง
                const currentValue = sel.value;
                
                let filteredJobs = [...state.jobs.filter(j => (j.category || 'flatbed') === state.activeCategory)];
                
                if(state.jobSortMode === 'alpha') {
                    // เรียงตามตัวอักษร ก-ฮ โดยรวมชื่อต้นทางและปลายทาง
                    filteredJobs.sort((a,b) => (a.origin+' '+a.dest).localeCompare(b.origin+' '+b.dest, 'th'));
                } // ถ้าเป็น recent จะใช้ลำดับเดิมจากฐานข้อมูล (ล่าสุดอยู่บน)
                
                let html = '<option value="">-- พิมพ์เอง หรือเลือกจากฐานข้อมูล --</option>';
                filteredJobs.forEach(j => {
                    html += `<option value="${j.id}" data-ori="${j.origin}" data-dest="${j.dest}" data-dist="${j.dist}" data-rev="${j.revenue}" data-fuelrate="${j.fuelRate||''}" data-fuelprice="${j.currentFuelPrice||''}" data-fuelcost="${j.fuelCost||0}" data-driverfee="${j.driverFee||0}">${j.origin} ➔ ${j.dest} (${formatCurrency(j.revenue)})</option>`;
                });
                
                sel.innerHTML = html;
                
                // คืนค่าที่เลือกไว้ให้เหมือนเดิม
                if (currentValue) sel.value = currentValue;

                // อัปเดตหน้าตาปุ่ม
                const btn = document.getElementById('btn-job-sort');
                if(btn) {
                    if(state.jobSortMode === 'recent') {
                        btn.innerHTML = '<i data-lucide="clock" class="w-3 h-3 mr-1"></i>เรียงตามล่าสุด';
                        btn.className = "text-slate-600 bg-slate-100 px-2 py-1 rounded text-xs font-bold flex items-center hover:bg-slate-200 transition-colors";
                    } else {
                        btn.innerHTML = '<i data-lucide="a-z" class="w-3 h-3 mr-1"></i>เรียงตาม ก-ฮ';
                        btn.className = "text-navy-700 bg-navy-100 px-2 py-1 rounded text-xs font-bold flex items-center hover:bg-navy-200 transition-colors";
                    }
                    lucide.createIcons();
                }
            }
